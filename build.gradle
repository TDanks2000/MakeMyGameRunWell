plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
subprojects {
    apply plugin: 'java-library'
    group = 'dev.makemygamerunwell'
    version = mod_version
    repositories { mavenCentral() }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    if (project.name != 'core') {
        // The project directory is versions/<minecraft version>/<loader>.
        def versionDir = projectDir.parentFile
        def versionProperties = new Properties()
        new File(versionDir, 'version.properties').withReader { versionProperties.load(it) }
        versionProperties.each { key, value -> ext.set(key as String, value) }
        ext.loader = projectDir.name
        base.archivesName = "makemygamerunwell-${loader}-${minecraft_version}"
        sourceSets.main {
            java.srcDirs rootProject.file('common/src/main/java'), rootProject.file('core/src/main/java'),
                    rootProject.file("loaders/${loader}/src/main/java"), new File(versionDir, 'src/main/java')
            resources.srcDirs rootProject.file('common/src/main/resources'),
                    rootProject.file("loaders/${loader}/src/main/resources"), new File(versionDir, 'src/main/resources')
        }
        tasks.named('jar') { from(rootProject.file('LICENSE')) }
        tasks.named('processResources') {
            inputs.property 'smokeTest', providers.gradleProperty('smokeTest').isPresent()
        }
        if (providers.gradleProperty('smokeTest').isPresent()) {
            apply from: rootProject.file('smoke/smoke.gradle')
        }
    }
}
