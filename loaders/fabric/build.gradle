plugins { id 'net.fabricmc.fabric-loom' }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // Needed at runtime: Fabric API's resource loader is what makes the mod's lang files visible.
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
if (providers.gradleProperty('smokeTest').isPresent()) {
    loom.runs.client.runDir('run-smoke')
}
processResources {
    def properties = [version: project.version, minecraft_min: minecraft_min, minecraft_below: minecraft_below,
                      fabric_loader_min: fabric_loader_min, fabric_api_min: fabric_api_version.take(fabric_api_version.indexOf('+'))]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}
